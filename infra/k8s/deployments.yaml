apiVersion: v1
kind: ServiceAccount
metadata:
  name: stock-agent-sa
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::734984528209:role/stock-agent-bedrock-irsa
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stock-agent-api
  labels:
    app: stock-agent-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: stock-agent-api
  template:
    metadata:
      labels:
        app: stock-agent-api
    spec:
      serviceAccountName: stock-agent-sa
      containers:
      - name: api
        image: 734984528209.dkr.ecr.us-east-1.amazonaws.com/stock-agent-api:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        resources:
          requests:
            cpu: "250m"
            memory: "256Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
        envFrom:
        - configMapRef:
            name: stock-agent-config
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stock-agent-ui-user
  labels:
    app: stock-agent-ui-user
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stock-agent-ui-user
  template:
    metadata:
      labels:
        app: stock-agent-ui-user
    spec:
      serviceAccountName: stock-agent-sa
      containers:
      - name: ui-user
        image: 734984528209.dkr.ecr.us-east-1.amazonaws.com/stock-agent-ui-user:latest
        imagePullPolicy: Always
        command: ["streamlit", "run", "ui/streamlit_app.py"]
        args:
        - --server.port=8501
        - --server.address=0.0.0.0
        - --server.headless=true
        - --browser.gatherUsageStats=false
        ports:
        - containerPort: 8501
        resources:
          requests:
            cpu: "100m"
            memory: "512Mi"
          limits:
            cpu: "500m"
            memory: "1Gi"
        envFrom:
        - configMapRef:
            name: stock-agent-config
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stock-agent-ui-ops
  labels:
    app: stock-agent-ui-ops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stock-agent-ui-ops
  template:
    metadata:
      labels:
        app: stock-agent-ui-ops
    spec:
      containers:
      - name: ui-ops
        image: 734984528209.dkr.ecr.us-east-1.amazonaws.com/stock-agent-ui-ops:latest
        imagePullPolicy: Always
        command: ["streamlit", "run", "ui/ops_dashboard.py"]
        args:
        - --server.port=8502
        - --server.address=0.0.0.0
        - --server.headless=true
        - --browser.gatherUsageStats=false
        ports:
        - containerPort: 8502
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        envFrom:
        - configMapRef:
            name: stock-agent-config
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "250m"
            memory: "256Mi"
